name: ZoneTab

options:
  bundleIdPrefix: dev.sasha
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: LY2W69ED92
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ZoneTabCore:
    type: framework
    platform: macOS
    sources: [ZoneTabCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sasha.zonetab.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  ZoneTab:
    type: application
    platform: macOS
    sources: [ZoneTab]
    dependencies:
      - target: ZoneTabCore
    info:
      path: ZoneTab/Support/Info.plist
      properties:
        CFBundleDisplayName: ZoneTab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSHumanReadableCopyright: ""
        CFBundleURLTypes:
          - CFBundleURLName: dev.sasha.zonetab
            CFBundleURLSchemes: [zonetab]
    settings:
      base:
        PRODUCT_NAME: ZoneTab
        PRODUCT_BUNDLE_IDENTIFIER: dev.sasha.zonetab
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_OBJC_BRIDGING_HEADER: ZoneTab/Support/ZoneTab-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  ZoneTabCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [ZoneTabCoreTests]
    dependencies:
      - target: ZoneTabCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sasha.zonetab.coretests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ZoneTab:
    build:
      targets:
        ZoneTab: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [ZoneTabCoreTests]
  ZoneTabCore:
    build:
      targets:
        ZoneTabCore: all
    test:
      config: Debug
      targets: [ZoneTabCoreTests]
